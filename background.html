<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <link rel="stylesheet" href="bg.css"/>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar">
  <div class="logo">WG</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gerard.html">About Me</a></li>
    <li><a href="background.html">🧑‍💻</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="motto.html">Motto</a></li>
    <li><a href="skills.html">Skills</a></li>
    <li><a href="reach.html">Contacts</a></li>
  </ul>
</nav>
<div class="container">
  <div class="text-content fade-in">
    <div class="floating-objects">
      <span class="float-item">🌍</span>
      <span class="float-item">⭐</span>
      <span class="float-item">🌕</span>
      <span class="float-item">☀️</span>
      <span class="float-item">🚀</span>
      <span class="float-item">💫</span>
      <span class="float-item">🌑</span>
      <span class="float-item">🪐</span>
    </div>
  <div class="container">
    <h1 id="heading">My Background</h1>
    <div class="content">
      <ul>
        <li class="fade-in">
          <span class="section-title">Education</span>
          <ul>
            <li>BSIT from Pamantasan ng Lungsod ng San Pablo, 2027</li>
            <li>LAGUNA UNIVERSITY, 2023</li>
            <li>ST. MARY'S ACADEMY OF NAGCARLAN, 2022</li>
          </ul>
        </li>
        <li class="fade-in">
          <span class="section-title">Work Experience</span>
          <ul>
            <li>SK Treasurer</li>
          </ul>
        </li>
      </ul>
    </div>
  </div>

  <script>
    // Typing animation for the heading
    const heading = document.getElementById("heading");
    const text = heading.textContent;
    heading.textContent = '';
    let index = 0;
    const typeText = () => {
      if (index < text.length) {
        heading.textContent += text.charAt(index);
        index++;
        setTimeout(typeText, 100);  // Speed of typing effect
      }
    };
    typeText();

    // Fade-in effect on page load
    window.addEventListener('load', () => {
      const fadeInElements = document.querySelectorAll('.fade-in');
      fadeInElements.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add('visible');
        }, index * 300);  // Staggered fade-in
      });

      // Scroll event to trigger animation when section is in view
      const sections = document.querySelectorAll('.content li');
      window.addEventListener('scroll', () => {
        sections.forEach(section => {
          const sectionTop = section.getBoundingClientRect().top;
          const screenHeight = window.innerHeight;

          if (sectionTop < screenHeight - 150) {
            section.classList.add('visible');
          }
        });
      });
    });

    // Example of smooth navbar transition on scroll
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = '#333';  // Change navbar color when scrolling
      } else {
        navbar.style.backgroundColor = 'transparent';  // Original color when at top
      }
    });
  </script>
</body>
</html>
